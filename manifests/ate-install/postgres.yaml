# Experimental PostgreSQL backend for ateapi (see docs/postgres-store.md).
# Single-replica, dev-only, not wired into
# the default `--store-backend` (which stays "redis"). Not resource- or
# HA-equivalent to valkey.yaml's six-process cluster; see the doc's
# benchmarking section before comparing the two.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: ate-system
data:
  postgresql.conf: |
    listen_addresses = '*'
    # Enforce TLS; mirrors valkey.yaml's TLS-only posture so the backend
    # comparison doesn't give PostgreSQL an artificial advantage.
    ssl = on
    ssl_cert_file = '/run/tls/credential-bundle.pem'
    ssl_key_file = '/run/tls/credential-bundle.pem'
    ssl_ca_file = '/etc/postgres-ca/ca.crt'
    hba_file = '/etc/postgresql/pg_hba.conf'
  pg_hba.conf: |
    # Auth mirrors valkey.yaml's model: any client presenting a certificate
    # signed by the trusted CA is accepted, no password and no per-cert
    # CN-to-role mapping.
    hostssl all all all trust clientcert=verify-ca
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ate-system
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ate-system
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # The official postgres image requires ssl_key_file to contain only a
      # private key with restrictive (0600) permissions. The projected
      # podCertificate source is world-readable, so copy it into a writable
      # emptyDir and fix permissions/ownership before postgres starts --
      # valkey.yaml doesn't need this because Valkey's TLS loading is more
      # lenient about combined cert+key files and file permissions.
      initContainers:
      - name: fix-tls-perms
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        securityContext:
          runAsUser: 70 # matches postgres:18-alpine's built-in "postgres" user (999 on Debian-based images, not alpine).
        command:
        - /bin/sh
        - -c
        - |
          set -e
          cp /run/servicedns.podcert.ate.dev/credential-bundle.pem /run/tls/credential-bundle.pem
          chmod 600 /run/tls/credential-bundle.pem
        volumeMounts:
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
        - name: tls
          mountPath: /run/tls
      containers:
      - name: postgres
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
        - name: POSTGRES_DB
          value: atepg
        - name: POSTGRES_HOST_AUTH_METHOD
          value: trust # only affects initdb's default pg_hba.conf, which hba_file above replaces.
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata # must be a subdirectory of the mounted volume.
        ports:
        - name: postgres
          containerPort: 5432
        # Deliberately no `command:` override: the image's docker-entrypoint.sh
        # ENTRYPOINT must run to do initdb/POSTGRES_DB setup and drop root
        # privileges via gosu before exec-ing postgres with these args.
        # Overriding `command:` bypasses all of that -- postgres then refuses
        # to start as root and the database is never initialized.
        args:
        - -c
        - config_file=/etc/postgresql/postgresql.conf
        volumeMounts:
        - name: config
          mountPath: /etc/postgresql
        - name: tls
          mountPath: /run/tls
        - name: postgres-ca-certs
          mountPath: /etc/postgres-ca
          readOnly: true
        - name: data
          mountPath: /var/lib/postgresql/data
        # Per docs/postgres-store.md: this is a single pod, not
        # resource-equivalent to valkey.yaml's 6-pod cluster. Record both
        # allocations alongside benchmark results rather than treating these
        # as a cost-equal comparison.
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "2Gi"
      volumes:
      - name: config
        configMap:
          name: postgres-config
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      - name: tls
        emptyDir: {}
      - name: postgres-ca-certs
        projected:
          sources:
          - secret:
              name: postgres-ca-certs
              items:
              - key: ca.crt
                path: ca.crt
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
