# Thirty actors contend for ten workers. Successful actors retain their worker
# for five seconds, ensuring the pool actually becomes exhausted before workers
# are released and reused. Do not use --reset-before: DebugClear also deletes
# the worker registrations created by atelet.

x-postgres-dsn: &postgres_dsn "postgresql://postgres@postgres.ate-system.svc:5432/atepg?sslmode=verify-full&sslrootcert=/etc/valkey-ca/ca.crt&sslcert=/run/servicedns.podcert.ate.dev/credential-bundle.pem&sslkey=/run/servicedns.podcert.ate.dev/credential-bundle.pem"

tests:
  - name: worker_contention_30u_10w_redis
    description: "30 actors contend for 10 held workers (backend: redis)"
    targetCluster: dev
    file: /app/tests/worker_contention.py
    duration: 90s
    users: 30
    workerCount: 10
    resetStoreBeforeWorkloads: true
    repeat: 3
    flags: &contention_flags
      - WorkerContentionUser
      - --worker-hold-time
      - "5"
      - --min-wait-time
      - "0.10"
      - --max-wait-time
      - "0.25"
      - --spawn-rate
      - "10"

  - name: worker_contention_30u_10w_postgres
    description: "30 actors contend for 10 held workers (backend: postgres)"
    targetCluster: dev
    storeBackend: postgres
    postgresConnectionString: *postgres_dsn
    file: /app/tests/worker_contention.py
    duration: 90s
    users: 30
    workerCount: 10
    resetStoreBeforeWorkloads: true
    repeat: 3
    flags: *contention_flags
