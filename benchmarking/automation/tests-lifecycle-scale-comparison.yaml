# Matched Redis/Postgres lifecycle comparison at 100,000 stored actors and
# 1,000 synthetic workers. The three profiles intentionally separate:
#
# 1. controlled lifecycle latency at 100 cycles/s;
# 2. sustained worker occupancy with staggered lifecycle transitions; and
# 3. the existing zero-wait saturation/capacity case.
#
# Every case runs for 90 seconds and repeats twice. PostgreSQL uses a
# 16-connection client pool, a 1-CPU request, and a 2-CPU limit.

x-postgres-pool-16: &postgres_pool_16 "postgresql://postgres@postgres.ate-system.svc:5432/atepg?sslmode=verify-full&sslrootcert=/etc/valkey-ca/ca.crt&sslcert=/run/servicedns.podcert.ate.dev/credential-bundle.pem&sslkey=/run/servicedns.podcert.ate.dev/credential-bundle.pem&pool_max_conns=16"
x-simulator-address: &simulator_address "atelet-simulator.ate-system.svc:8085"

x-controlled-flags: &controlled_flags
  - LifecycleScaleUser
  - --reset-before
  - --scale-actors
  - "100000"
  - --scale-workers
  - "1000"
  - --verify-scale
  - --spawn-rate
  - "100"
  - --lifecycle-mode
  - sufficient
  - --hot-resumes
  - "1"
  - --lifecycle-cycle-rate
  - "100"
  - --min-wait-time
  - "0"
  - --max-wait-time
  - "0"

x-sustained-worker-flags: &sustained_worker_flags
  - LifecycleScaleUser
  - --reset-before
  - --scale-actors
  - "100000"
  - --scale-workers
  - "1000"
  - --verify-scale
  - --spawn-rate
  # Approximately a 15-second ramp. These are active sessions holding workers,
  # not 1,000 simultaneous lifecycle requests.
  - "67"
  - --lifecycle-mode
  - oversubscribed
  - --worker-hold-time
  - "10"
  # Prevent the Go worker from busy-spinning while actors remain running and
  # add small end-time jitter. With 1,000 users and a 10-second hold, the
  # closed workload should settle near 95-100 cycles/s and 950-1,000 occupied
  # workers.
  - --min-wait-time
  - "0.10"
  - --max-wait-time
  - "0.25"

x-saturation-flags: &saturation_flags
  - LifecycleScaleUser
  - --reset-before
  - --scale-actors
  - "100000"
  - --scale-workers
  - "1000"
  - --verify-scale
  - --spawn-rate
  - "100"
  - --lifecycle-mode
  - sufficient
  - --hot-resumes
  - "1"
  - --min-wait-time
  - "0"
  - --max-wait-time
  - "0"

tests:
  - name: lifecycle_scale_controlled_100cps_redis
    description: "Controlled: 1k users globally limited to 100 lifecycle cycles/s (Redis)"
    targetCluster: dev
    ateletSimulatorAddress: *simulator_address
    file: /app/tests/lifecycle_scale.py
    duration: 90s
    users: 1000
    deployWorkloads: false
    deployLifecycleScale: true
    repeat: 2
    flags: *controlled_flags

  - name: lifecycle_scale_sustained_workers_redis
    description: "Sustained occupancy: 1k sessions hold workers for 10s (Redis)"
    targetCluster: dev
    ateletSimulatorAddress: *simulator_address
    file: /app/tests/lifecycle_scale.py
    duration: 90s
    users: 1000
    deployWorkloads: false
    deployLifecycleScale: true
    repeat: 2
    flags: *sustained_worker_flags

  - name: lifecycle_scale_saturation_redis
    description: "Capacity: 1k zero-wait lifecycle users (Redis)"
    targetCluster: dev
    ateletSimulatorAddress: *simulator_address
    file: /app/tests/lifecycle_scale.py
    duration: 90s
    users: 1000
    deployWorkloads: false
    deployLifecycleScale: true
    repeat: 2
    flags: *saturation_flags

  - name: lifecycle_scale_controlled_100cps_postgres
    description: "Controlled: 1k users globally limited to 100 lifecycle cycles/s (Postgres pool 16 / 2 CPU)"
    targetCluster: dev
    storeBackend: postgres
    postgresConnectionString: *postgres_pool_16
    ateletSimulatorAddress: *simulator_address
    file: /app/tests/lifecycle_scale.py
    duration: 90s
    users: 1000
    deployWorkloads: false
    deployLifecycleScale: true
    repeat: 2
    flags: *controlled_flags

  - name: lifecycle_scale_sustained_workers_postgres
    description: "Sustained occupancy: 1k sessions hold workers for 10s (Postgres pool 16 / 2 CPU)"
    targetCluster: dev
    storeBackend: postgres
    postgresConnectionString: *postgres_pool_16
    ateletSimulatorAddress: *simulator_address
    file: /app/tests/lifecycle_scale.py
    duration: 90s
    users: 1000
    deployWorkloads: false
    deployLifecycleScale: true
    repeat: 2
    flags: *sustained_worker_flags

  - name: lifecycle_scale_saturation_postgres
    description: "Capacity: 1k zero-wait users (Postgres pool 16 / 2 CPU)"
    targetCluster: dev
    storeBackend: postgres
    postgresConnectionString: *postgres_pool_16
    ateletSimulatorAddress: *simulator_address
    file: /app/tests/lifecycle_scale.py
    duration: 90s
    users: 1000
    deployWorkloads: false
    deployLifecycleScale: true
    repeat: 2
    flags: *saturation_flags
